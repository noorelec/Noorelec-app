<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech — Connexion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }
        h1 { font-size: 26px; color: #333; margin-bottom: 8px; }
        .sub { color: #666; font-size: 15px; margin-bottom: 28px; line-height: 1.5; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 18px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #5568d3; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #err {
            margin-top: 16px;
            color: #b91c1c;
            font-size: 14px;
            line-height: 1.4;
        }
        .hint { margin-top: 20px; font-size: 13px; color: #888; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>DevTech</h1>
        <p class="sub">Connexion réservée aux électriciens abonnés (essai ou mensuel).</p>
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="email" placeholder="vous@exemple.be">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
        <button type="button" id="btn">Se connecter</button>
        <p id="err"></p>
        <p style="text-align:center;margin-top:20px;font-size:15px;">
            <a href="inscription.html" style="color:#667eea;font-weight:600;">Créer un compte — essai 14 jours (TVA)</a>
        </p>
        <p class="hint">Après connexion, vérifiez votre e-mail si demandé par Firebase, puis accédez au tableau de bord.</p>
    </div>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAQ9YFHCYhKG-65rqJp31QEb68F9oY4HFk",
            authDomain: "devtech-20997.firebaseapp.com",
            projectId: "devtech-20997",
            storageBucket: "devtech-20997.firebasestorage.app",
            messagingSenderId: "95961701207",
            appId: "1:95961701207:web:25ac1e97f292c58797bc12",
            measurementId: "G-7S08YYT59J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'app.html';
            }
        });

        const btn = document.getElementById('btn');
        const err = document.getElementById('err');

        btn.addEventListener('click', async () => {
            err.textContent = '';
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) {
                err.textContent = 'Renseignez l’e-mail et le mot de passe.';
                return;
            }
            btn.disabled = true;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'app.html';
            } catch (e) {
                err.textContent = e.code === 'auth/invalid-credential'
                    ? 'E-mail ou mot de passe incorrect.'
                    : (e.message || 'Connexion impossible.');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
